name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DISCORD_CLIENT_ID: ci-client
      DISCORD_CLIENT_SECRET: ci-secret
      SUPER_ADMIN_DISCORD_IDS: "123"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
